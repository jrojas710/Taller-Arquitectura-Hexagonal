services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: stagepass_legacy
      MYSQL_USER: stagepass
      MYSQL_PASSWORD: stagepass
    ports:
      - "3306:3306"
    volumes:
      - ./db/legacy-mysql.sql:/docker-entrypoint-initdb.d/legacy-mysql.sql

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
